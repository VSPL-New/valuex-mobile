name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      strict_store_checks:
        description: Fail on store-compliance warnings (use before a release)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          dart format lib test integration_test
          git diff --exit-code -- lib

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage --dart-define=SKIP_PIXEL_CONTRAST=true

      - name: Coverage gate
        run: tool/check_coverage.sh coverage/lcov.info 85

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info

  store-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Store compliance (static)
        run: tool/check_store_compliance.sh ${{ inputs.strict_store_checks && '--strict' || '' }}

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # The Android build fills the runner disk, so saving the SDK cache afterwards fails.
          cache: false
      - run: flutter pub get
      - run: flutter build apk --debug --dart-define-from-file=config/dev_android.json

  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ios:
              - 'ios/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'

  ios-build:
    needs: changes
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.ios == 'true')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign --dart-define-from-file=config/dev_ios.json
